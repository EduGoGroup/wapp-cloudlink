syntax = "proto3";

package wapp.cloudlink.v1;

option go_package = "github.com/EduGoGroup/wapp-cloudlink/gen/wapp/cloudlink/v1;cloudlinkv1";

// Enrollment: enrolamiento por código de un solo uso. Unario, sobre TLS de
// servidor (el Edge aún no tiene cert). El Edge envía su CSR y recibe el
// certificado de Edge/tenant con el que después abrirá el stream con mTLS.
service Enrollment {
  rpc EnrollEdge(EnrollEdgeRequest) returns (EnrollEdgeResponse);
}

message EnrollEdgeRequest {
  string activation_code = 1;
  bytes csr_pem = 2;
}

message EnrollEdgeResponse {
  bytes edge_cert_pem = 1;
  bytes ca_chain_pem = 2;
  string tenant_id = 3;
  bytes cloud_enc_pubkey = 4; // pública X25519 (32B) de cifrado de la nube, para que el Edge selle los campos sensibles
  // lease_pubkey: pública Ed25519 (32B crudos, SIN codificar) de la clave de
  // firma del lease (kill-switch, ADR-0007). La emite y custodia la nube
  // (leaseMgr.PublicKey()); el Edge la persiste para poder validar offline la
  // firma de cada lease que recibe y así detectar un clon con DEK robada pero
  // sin lease vigente. Campo aditivo (Plan 055 · T4.1, D-055.5) — mismo patrón
  // que cloud_enc_pubkey (campo 4). La codificación en disco (hex/base64) es
  // decisión del Edge, no de este contrato: aquí viajan los bytes crudos.
  bytes lease_pubkey = 5;
}

// CloudLink: único canal Edge<->cloud. Stream bidireccional persistente con
// mTLS. La nube empuja comandos (CloudToEdge) y el Edge emite eventos/estados
// (EdgeToCloud). Multiplexado por session_id; correlación por command_id.
service CloudLink {
  rpc Connect(stream EdgeToCloud) returns (stream CloudToEdge);
}

// Comandos cloud -> edge.
message CloudToEdge {
  string command_id = 1;
  string session_id = 2;
  // 12 = run_flow_step (RunFlowStep), RETIRADO el 2026-08-12. Nació previsto y
  // murió sin nacer: NUNCA tuvo productor ni consumidor. La nube no lo emitía y
  // el switch de handleCommand del Edge no lo contemplaba (caía en el default).
  // La máquina de estados vive ENTERA en la nube (ADR-0005) y las respuestas
  // salen como SendText/SendMedia, así que no hay nada que este frame pudiera
  // transportar. Reservado —no reutilizar el 12 ni el nombre— para que ningún
  // Edge viejo interprete otra cosa en ese hueco.
  reserved 12;
  reserved "run_flow_step";
  oneof payload {
    SendText send_text = 10;
    SendMedia send_media = 11;
    LeaseUpdate lease_update = 13;
    Ping ping = 14;
    ConfigUpdate config_update = 15;
    DiagnosticsRequest diagnostics_request = 16;
    // Plan 033 / ADR-0025: respuesta única de autenticación de usuario del
    // operador del Edge. Sirve a los tres request (login/refresh/logout),
    // correlacionada por command_id. El Edge relaya credenciales→IAM; el
    // tenant es implícito del canal mTLS (no viaja en el mensaje).
    UserAuthResponse user_auth_response = 17;
    // Plan 044 · Ola 1.6 / ADR-0045 (REQ-34): petición de inferencia servida por
    // el Edge. El Cloud es el ÚNICO orquestador LLM y baja el prompt ya
    // construido; el Edge no interpreta ni altera nada. Se correlaciona con el
    // InferenceResult por command_id (patrón DiagnosticsRequest/Bundle).
    InferenceRequest inference_request = 18;
  }
}

// Eventos/estados edge -> cloud.
message EdgeToCloud {
  string command_id = 1;
  string session_id = 2;
  // 11 = delivery (DeliveryStatus), RETIRADO el 2026-08-12. Era el simétrico del
  // 12 de CloudToEdge: frame con CONSUMIDOR y sin PRODUCTOR. La nube lo recibía
  // (un log.Debug en connect.go y nada más), pero ningún punto del Edge lo emitió
  // jamás: los acuses reales viajan como MessageReceipt (campo 15) desde el
  // Plan 013, con su tabla message_receipts y su correlación por MessageID.
  reserved 11;
  reserved "delivery";
  oneof payload {
    IncomingMessage incoming = 10;
    Ack ack = 12;
    Heartbeat heartbeat = 13;
    Pong pong = 14;
    MessageReceipt receipt = 15;
    DiagnosticsBundle diagnostics_bundle = 16;
    // Plan 033 / ADR-0025: peticiones de autenticación de usuario del operador
    // del Edge. El Edge relaya las credenciales hacia el IAM de la nube por el
    // stream bidi existente; el tenant es implícito del canal mTLS (NO va en el
    // mensaje). Todas se correlacionan con un UserAuthResponse por command_id.
    UserLoginRequest user_login = 17;
    UserRefreshRequest user_refresh = 18;
    UserLogoutRequest user_logout = 19;
    // Plan 044 · Ola 1.6 / ADR-0045 (REQ-34): resultado de una inferencia servida
    // por el Edge, correlacionado por command_id con el inference_request que la
    // pidió. O trae la salida sellada, o un error nombrado; nunca las dos.
    InferenceResult inference_result = 20;
  }
}

message SendText {
  string to = 1;
  string text = 2;
}

message SendMedia {
  string to = 1;
  string caption = 2;
  string mime = 3;
  string filename = 4; // nombre del archivo (DocumentMessage.FileName/Title)
  MediaKind kind = 5; // elige rama DocumentMessage vs ImageMessage (el mime no basta)
  // 10 = inline (bytes), RETIRADO el 2026-08-12: el contrato lo declaraba y el
  // Edge no lo miró nunca — handleSendMedia lee SIEMPRE presigned_url, así que un
  // SendMedia con inline producía una descarga de URL vacía y un fallo. El media
  // viaja por URL prefirmada de corta vida (Plan 017): el Edge descarga sin
  // credenciales y nunca recibe el archivo por el stream.
  reserved 10;
  reserved "inline";
  oneof src {
    string presigned_url = 11;
  }
}

// Discriminador del tipo de media a enviar: define qué rama de whatsmeow usa el
// Edge (DocumentMessage vs ImageMessage), ya que el mime por sí solo no basta.
enum MediaKind {
  MEDIA_KIND_UNSPECIFIED = 0;
  MEDIA_KIND_DOCUMENT = 1; // documento (PDF, etc.)
  MEDIA_KIND_IMAGE = 2; // imagen
}

message LeaseUpdate {
  bytes lease = 1;
  int64 expires_unix = 2;
  bool revoked = 3;
}

message Ping {
  int64 nonce = 1;
}

message IncomingMessage {
  string from = 1;
  string text = 2;
  int64 ts_unix = 3;
  string wa_message_id = 4;
  bool is_group = 5;
  string push_name = 6; // nombre visible del remitente (dato de negocio)
  string from_pn = 7; // número real (E.164 sin '+') si se conoce
  string from_lid = 8; // LID si se conoce
  string addressing_mode = 9; // "pn" | "lid" (diagnóstico)
  bytes enc_payload = 10; // sellado X25519 (SealFor) de un SensitivePayload marshalado, cuando está presente; si va, los planos sensibles (text/push_name/from_pn/from_lid) viajan vacíos
  // 11 = intent (el sub-mensaje de clasificación local del Plan 029/ADR-0020,
  // borrado entero de este .proto en el mismo cambio), RETIRADO el 2026-08-24. El push de la
  // clasificación muere ENTERO, no a plazos (ADR-0045 §4, D-044.31): la
  // clasificación pasa a PULL y el Cloud la PIDE con inference_request cuando la
  // necesita, dentro de su ventana de agregación. El push estaba muerto y MEDIDO:
  // el Edge retenía cada entrante 4 s esperando una inferencia cuyo p50 real es
  // 8,1 s — de 430 inferencias UNA cupo en la ventana, y por este campo no llegó
  // JAMÁS un intent a la nube. Reservado —no reutilizar el 11 ni el nombre— para
  // que ningún Edge viejo interprete otra cosa en ese hueco.
  reserved 11;
  reserved "intent";
}

// Sub-payload de los campos sensibles de IncomingMessage. El Edge lo marshala y
// lo sella (SealFor) hacia enc_payload; la nube lo abre y lo desmarshala.
message SensitivePayload {
  string text = 1;
  string push_name = 2;
  string from_pn = 3;
  string from_lid = 4;
  // 5 = intent (el mismo sub-mensaje de clasificación local que se retiró del
  // campo 11 de IncomingMessage), RETIRADO el 2026-08-24 en aquel mismo cambio.
  // Era el camino "bueno" del push —la clasificación sellada— y muere con él:
  // bajo pull (ADR-0045 §4, D-044.31) el Edge ya no clasifica por iniciativa
  // propia, así que no hay nada que adjuntar aquí. La salida del modelo viaja
  // ahora sellada en su propio frame (InferenceResult.enc_output). No reutilizar
  // el 5 ni el nombre.
  reserved 5;
  reserved "intent";
}

// Acuse de estado de un saliente (delivered/read). Aditivo (Plan 013): sube por
// el stream EdgeToCloud correlacionado con el command_id del SendText original.
// Higiene zero-knowledge: SOLO IDs/estado/timestamp/session/command_id; NUNCA
// texto, número de teléfono, JID ni contenido.
message MessageReceipt {
  string session_id = 1; // sesión del Edge (multiplexado)
  repeated string message_ids = 2; // los MessageIDs acusados (metadato, no PII)
  ReceiptStatus status = 3; // DELIVERED | READ
  int64 timestamp = 4; // epoch del receipt (types.Receipt.Timestamp)
  string command_id = 5; // correlación con el SendText original (opaco, no PII)
}

// Estado de acuse de un mensaje saliente.
enum ReceiptStatus {
  RECEIPT_STATUS_UNSPECIFIED = 0;
  RECEIPT_STATUS_DELIVERED = 1; // ✓✓ entregado
  RECEIPT_STATUS_READ = 2; // ✓✓ azul leído
}

message Ack {
  string acked_command_id = 1;
  bool ok = 2;
  string error = 3;
}

// Heartbeat: frame de estado/liveness edge->cloud. Ancla la sesión en el Cloud
// (el primer Heartbeat con identidad mTLS dispara MarkOnline) y renueva el lease
// por su lease_counter. Se emite periódicamente por cada sesión registrada.
message Heartbeat {
  int64 lease_counter = 1;
  // T2 (Plan 020, anti-self-loop): número propio E.164 (sin '+') del device de
  // esta sesión. El Cloud lo usa para reconocer cuando el remitente de un
  // entrante es un número propio del mismo tenant y así cortar el bucle. Viaja
  // en el Heartbeat porque es el mismo frame que dispara MarkOnline. Opcional:
  // vacío en Edges antiguos (compat).
  string self_pn = 2;
  // T2 (opcional, diagnóstico): JID crudo del device propio (p.ej.
  // "12025550100:12@s.whatsapp.net"). El Cloud compara por self_pn; self_jid es
  // solo trazabilidad. Puede ir vacío.
  string self_jid = 3;
  // T3 (Plan 020, estatus/zombie): estado reportado de la sesión. Por defecto
  // SESSION_STATE_UNSPECIFIED (heartbeat normal). SESSION_STATE_LOGGED_OUT marca
  // que WhatsApp cerró el dispositivo (LoggedOut): el Cloud debe marcar la sesión
  // como zombie/loggedout, distinta de un offline por caída de red.
  SessionState state = 4;
  // T1 (Plan 031, telemetría de salud): snapshot operativo de la sesión adjunto
  // al mismo frame que dispara MarkOnline. OPCIONAL: los Edges antiguos no lo
  // envían y el Cloud debe tratar su ausencia como "sin datos de salud" (no como
  // salud mala). Separa el registro CloudLink (link_state) de la salud real del
  // socket de WhatsApp. Frontera zero-knowledge (ADR-0007): SOLO metadatos
  // operativos; JAMÁS llaves, DEK, credenciales ni contenido de mensajes.
  SessionHealth session_health = 5;
}

// SessionHealth: snapshot operativo de una sesión del Edge (Plan 031, ADR-0023).
// Todos sus campos son opcionales semánticamente: un colector que no pueda medir
// alguno lo deja en su cero. Viaja adjunto al Heartbeat. Frontera zero-knowledge
// (ADR-0007): SOLO metadatos de salud operativa. Aquí NUNCA van llaves privadas,
// la DEK, credenciales, JIDs/números ni contenido de mensajes; solo señales para
// operar la flota (~1000 Edges sin SSH).
message SessionHealth {
  // Estado real del socket de WhatsApp (whatsmeow), con prueba de vida: no "el
  // cliente existe" sino conectividad efectiva. Ver enum abajo.
  WhatsappSocketState whatsapp_socket_state = 1;
  // Motivo legible por máquina de una degradación (p. ej. "dek_load_timeout",
  // "dial_timeout"). Vacío si no hay degradación. Es un código operativo, no PII.
  string degraded_reason = 2;
  // Edad en segundos del último evento entrante procesado (prueba de vida del
  // socket receptor). 0 si aún no se ha recibido ninguno.
  int64 last_inbound_event_age_s = 3;
  // Duración en milisegundos de la última carga de la DEK (T6: detecta Keychain
  // lento). Es una métrica de tiempo; NO expone la DEK ni su material.
  int64 dek_load_duration_ms = 4;
  // Estado del circuito del clasificador de intenciones local (Plan 029): uno de
  // "closed" | "open" | "half_open". Vacío si la pieza 06 (intents) no está
  // activa en este Edge. String por ser opcional y desacoplado del 029.
  string intent_circuit = 5;
  // Profundidad actual del outbox SQLite (ADR-0003): mensajes salientes pendientes
  // de drenar. Señal de saturación/desconexión.
  int64 outbox_depth = 6;
  // Versión del binario del Edge inyectada en build (trazabilidad de flota y base
  // del auto-update del Plan 032). No es PII.
  string binary_version = 7;
  // Tiempo en segundos que lleva vivo el daemon del Edge (uptime del proceso).
  int64 daemon_uptime_s = 8;
  // Veredicto del reparto de CPU entre el proceso del cajero de intents y Ollama
  // (Plan 051, T2.8): uno de "disjunta" | "solapada" | "cajero_sin_confinar".
  // Existe porque los dos compiten por los mismos núcleos: si sus afinidades se
  // solapan, la inferencia y el despacho se estorban y el síntoma que se ve en la
  // nube es latencia, no una causa. Vacío = ESTE EDGE NO LO SABE (no es Linux, o
  // el parte del worker está rancio). Mismo patrón que intent_circuit (campo 5):
  // vacío significa "no lo sé", NUNCA "está bien".
  string worker_taskset = 9;
  // p50 en milisegundos de la INFERENCIA del clasificador local (Plan 029), medido
  // por el worker sobre sus propias muestras. 0 = no medible en este Edge (el
  // worker no tiene muestras, o su parte está rancio); 0 NO significa "instantáneo".
  // ⚠️ NO es el p50 del handler de whatsmeow: esa es otra población (todos los
  // entrantes, no solo los clasificados) y además otro proceso. Confundirlos es un
  // error fácil y silencioso — el número parece plausible y la conclusión es falsa.
  int64 intent_p50_ms = 10;
  // Despachos que salieron SIN intent publicado, desglosados por motivo (cierra
  // INV-051.3). La clave es el motivo tal cual lo enumera app.MotivosOmitido() en
  // el Edge; hoy son ocho: "fastlane", "sin_texto", "no_elegible", "presupuesto",
  // "breaker", "desconocido", "apagado", "fallo_repetido".
  //
  // Es un mapa y no un campo por motivo a propósito: un motivo nuevo en el Edge no
  // debe exigir un release de este contrato ni un bump en los dos consumidores —y
  // la lista, al transcribirla a mano, ya se ha quedado corta dos veces.
  //
  // ⚠️ Estos contadores NUNCA se suman entre sí. "fastlane" es el camino sano (se
  // omitió porque no hacía falta clasificar) y "presupuesto"/"breaker" no lo son
  // (se omitió porque el clasificador no pudo). Agregarlos en un solo total borra
  // exactamente la información por la que existe el desglose.
  map<string, int64> intent_omitted_by_reason = 11;
  // Contadores del despachador nacidos en el barrido de la Ola 3 (Plan 051, T3.12).
  // Son cuatro campos y no un agregado por diseño:
  //
  //  - stuck_heads / stuck_head_polls miden la cabeza de cola atascada. Existen
  //    porque ANTES de T3.12 ese caso no tenía contador, y sin él la telemetría
  //    publicaba una sesión MUERTA como si estuviera ociosa: cero despachos se lee
  //    igual "no hay trabajo" que "el trabajo no avanza". stuck_heads cuenta las
  //    cabezas detectadas atascadas; stuck_head_polls, las veces que se sondeó una.
  //  - failed_seal_dispatch y failed_seal_budget están SEPARADOS a propósito: solo
  //    UNO de los dos implica mensajes duplicados. El fallo al sellar el despacho
  //    deja el mensaje sin marca de salida y puede reenviarse; el fallo al sellar el
  //    presupuesto solo descuadra la contabilidad del gasto, sin duplicar nada.
  //    Volver a agregarlos en un contador único deshace T3.12 y devuelve la
  //    ambigüedad que costó el barrido entero encontrar.
  //
  // Los cuatro son acumulados del proceso; 0 = no ocurrió (o Edge que no los mide).
  int64 stuck_heads = 12;
  int64 stuck_head_polls = 13;
  int64 failed_seal_dispatch = 14;
  int64 failed_seal_budget = 15;
}

// WhatsappSocketState: estado del socket de WhatsApp reportado por el Edge con
// prueba de vida (Plan 031). Aditivo/no-breaking: valores nuevos SIEMPRE al
// final. UNSPECIFIED = el Edge no reporta salud del socket (compat).
enum WhatsappSocketState {
  WHATSAPP_SOCKET_STATE_UNSPECIFIED = 0; // sin dato de salud (Edge antiguo / no medido)
  WHATSAPP_SOCKET_STATE_CONNECTED = 1;   // socket vivo y conectado (IsConnected + prueba de vida)
  WHATSAPP_SOCKET_STATE_CONNECTING = 2;  // conectando/reconectando (backoff en curso)
  WHATSAPP_SOCKET_STATE_DEGRADED = 3;    // vivo pero degradado (ver degraded_reason)
  WHATSAPP_SOCKET_STATE_DEAD = 4;        // socket caído/inoperante
}

// Estado de sesión reportado por el Edge en el Heartbeat (Plan 020, T3). Aditivo
// y no-breaking: valores nuevos se agregan SIEMPRE al final.
enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0; // sin novedad: heartbeat de liveness normal (default/compat)
  SESSION_STATE_LOGGED_OUT = 1; // WhatsApp cerró el device (events.LoggedOut) => zombie
}

message Pong {
  int64 nonce = 1;
}

// Push genérico de configuración Cloud->Edge (ADR-0021). Frame extensible: kind
// discrimina el tipo de configuración empujada y payload lleva el contenido
// serializado propio de ese kind (versionado por version). Primer kind:
// "intents" (catálogo de intenciones del clasificador local del Plan 029). El
// Edge que no reconozca un kind debe ignorarlo sin error (compat aditiva).
message ConfigUpdate {
  string command_id = 1; // correlación con el Ack del Edge
  string session_id = 2; // sesión destino (multiplexado); vacío = a todas las del Edge
  string kind = 3; // tipo de configuración (p.ej. "intents")
  string version = 4; // versión del contenido, para idempotencia/trazabilidad
  bytes payload = 5; // contenido serializado propio del kind
}

// DiagnosticsRequest: la nube pide bajo demanda un paquete de diagnóstico a un
// Edge (Plan 031, ADR-0023). Diagnóstico remoto de una flota sin SSH. El Edge
// responde con un DiagnosticsBundle correlacionado por command_id (patrón
// ConfigUpdate: Ack + idempotencia por command_id). Solo metadatos operativos.
message DiagnosticsRequest {
  string command_id = 1; // correlación con el Ack y con el DiagnosticsBundle de respuesta
  string session_id = 2;  // sesión objetivo (multiplexado); vacío = alcance del Edge completo
  // Alcance del diagnóstico pedido (p. ej. "full", "logs", "goroutines",
  // "subsystems"). String por extensibilidad; el Edge ignora un scope que no
  // reconozca y devuelve lo que sepa (compat aditiva).
  string scope = 3;
}

// DiagnosticsBundle: respuesta del Edge a un DiagnosticsRequest (Plan 031). Sube
// por EdgeToCloud correlacionado por command_id. Frontera zero-knowledge dura
// (ADR-0007): SOLO material operativo de diagnóstico; el Edge DEBE sanear antes
// de enviar — JAMÁS llaves, DEK, credenciales, tokens ni contenido de mensajes,
// ni en logs ni en dumps (el Plan 031 T8 añade un gate que escanea el bundle).
//
// Tope de tamaño: el transporte ya impone un máximo de 4 MiB por frame gRPC. El
// bundle DEBE caber en ese límite; el Edge trunca en origen (ring buffer de N
// líneas de log, dump acotado) antes de enviar. Si un futuro diagnóstico no
// cupiera, se trocearía por command_id — hoy no hace falta.
message DiagnosticsBundle {
  string command_id = 1;     // correlación con el DiagnosticsRequest que lo originó
  string log_tail = 2;       // últimas N líneas del ring buffer de logs (ya saneadas, truncadas en origen)
  string goroutine_dump = 3; // volcado de goroutines (runtime.Stack(all=true)), truncado en origen
  string subsystems_json = 4; // snapshot JSON de subsistemas (intent/status y pares); metadatos operativos, no PII
}

// InferenceRequest: el Cloud pide una inferencia al proveedor LOCAL del Edge
// (Plan 044 · Ola 1.6, ADR-0045 §2, REQ-34). Baja por CloudToEdge y el Edge
// responde con un InferenceResult correlacionado por command_id — el mismo molde
// request/response de DiagnosticsRequest/DiagnosticsBundle.
//
// Contrato de conducta: el Edge NO interpreta ni altera nada — "prompt entra →
// JSON sale". El troceado, los prompts, el orden de las llamadas y la validación
// viven ENTEROS en el Cloud (ADR-0045 §1), porque afinar un producto LLM es tocar
// prompts a diario y orquestar abajo exigiría desplegar a la máquina de cada
// cliente por cada coma. Esto ACOTA al ADR-0005 sin romperlo: el Edge gana la
// función de SERVIR inferencia, igual que el ADR-0020 le dio la de anotar, y
// sigue sin decidir negocio (no arma payloads, no calcula precios, no responde a
// nadie). Servir inferencia es OPERAR: respeta el lease como cualquier orden.
//
// El MODELO no viaja en este frame a propósito: lo elige el Edge, porque es
// propiedad de la máquina del cliente (qué cabe en su RAM, qué tolera su CPU). Un
// modelo pedido desde la nube sería una orden que el Edge no siempre puede
// cumplir, y el fallo aparecería como lentitud, no como negativa.
//
// Sobre `think`: el control de "thinking" del modelo NO es un campo de este frame
// — es POLÍTICA FIJA del Edge (`think:false` SIEMPRE cuando el modelo lo soporta,
// ADR-0045 §5 / Plan 044 · T1.6-2). Dos razones para no darle perilla al Cloud:
// (1) su único valor no-por-defecto degrada la máquina del cliente en ÓRDENES DE
// MAGNITUD —medido: precargar sin `think:false` convirtió una inferencia de 4 s
// en 4 MINUTOS—, así que como campo solo serviría para romper una máquina que no
// es nuestra; y (2) es vocabulario de Ollama, y este contrato debe sobrevivir al
// proveedor (el día que abajo haya otro motor, un campo `think` sería basura
// heredada que alguien tendría que traducir o retirar).
message InferenceRequest {
  string command_id = 1; // correlación con el InferenceResult de respuesta
  // Sesión objetivo (multiplexado). NORMALMENTE VACÍA: el servicio de inferencia
  // es del EDGE —un proceso, un Ollama—, no de una sesión de WhatsApp. Se declara
  // por simetría con DiagnosticsRequest (campo 2) y como trazabilidad de qué
  // conversación originó la pregunta cuando el Cloud lo sabe; vacío NO es un
  // error y el Edge no debe exigirlo.
  string session_id = 2;
  // El prompt YA CONSTRUIDO por el Cloud (sistema + few-shot + texto del cliente,
  // armado desde intent_configs). El Edge lo entrega al modelo VERBATIM: no lo
  // recorta, no lo completa y no le añade contexto propio.
  string prompt = 3;
  // Formato esperado de la salida: "json" a secas, o un JSON Schema serializado.
  // Viaja como string OPACO y el Edge lo reenvía verbatim al proveedor sin
  // parsearlo (parsearlo sería interpretar). Vacío = sin restricción de formato.
  string format = 4;
  // Temperatura de muestreo. `optional` A PROPÓSITO: 0.0 es a la vez el valor que
  // más se va a pedir (determinismo para clasificar) y el cero del campo — sin
  // presencia explícita, "quiero 0" y "no dije nada" serían el MISMO byte en el
  // cable y el Edge no podría distinguirlos. Ausente = el Edge aplica su default.
  optional float temperature = 5;
  // Presupuesto de tiempo de ESTA inferencia, en milisegundos. Lo fija el Cloud
  // porque es quien conoce su ventana (los 45 s de agregación del Nivel C, el
  // turno acotado del Nivel B — ADR-0044). Agotado ⇒ el Edge responde
  // INFERENCE_ERROR_TIMEOUT; colgarse no es una opción. 0 = default del Edge.
  int64 timeout_ms = 6;
  // PREVISTO Y HOY VACÍO — el prompt sellado hacia el Edge. Ningún emisor lo
  // puebla y ningún receptor debe exigirlo ni tratar su ausencia como fallo.
  //
  // (a) Por qué va vacío. El sellado de este contrato es ASIMÉTRICO POR
  //     CONSTRUCCIÓN: lo único que se distribuye hoy es `cloud_enc_pubkey`
  //     (EnrollEdgeResponse campo 4), o sea que el Edge sabe CERRAR sobres hacia
  //     la nube (envelope.SealFor) y la nube ABRIRLOS (envelope.OpenWith), pero
  //     el Edge NO tiene par X25519 propio ⇒ la nube no puede sellar hacia él.
  //     Mientras tanto el prompt viaja EN CLARO DENTRO DEL mTLS, con el mismo
  //     criterio ya aceptado del fallback del Plan 011 §10.H ("mTLS sigue
  //     protegiendo el canal").
  // (b) Por qué la asimetría no abre nada nuevo en ESTE extremo. El texto del
  //     cliente que el prompt lleva dentro YA LO TENÍA el Edge: se lo escribió el
  //     cliente por WhatsApp momentos antes y fue el Edge quien lo entregó.
  //     Bajárselo dentro de un prompt no le revela nada que no hubiera visto; y
  //     lo demás que el prompt lleve (instrucciones, catálogo) es material del
  //     PROPIO tenant, cuya máquina es este Edge.
  // (c) Qué haría falta para llenarlo. Dar al Edge un par X25519 propio y publicar
  //     su pública en el enrolamiento (el simétrico de cloud_enc_pubkey). Eso NO
  //     está previsto en ninguna ola a día de hoy: el campo existe para que el día
  //     que se decida no haya que renumerar nada, no porque esté en camino.
  //
  // El número va en el rango alto a propósito, para dejar juntos en el rango bajo
  // los campos de uso diario.
  bytes enc_prompt = 9;
}

// InferenceResult: respuesta del Edge a un InferenceRequest (Plan 044 · Ola 1.6,
// ADR-0045 §2, REQ-34). Sube por EdgeToCloud correlacionado por command_id —
// molde exacto de DiagnosticsBundle: el campo 1 es el command_id del request que
// lo originó y NO lleva session_id (el sobre EdgeToCloud ya lo transporta).
//
// El oneof `result` copia el molde de UserAuthResponse: o hay salida, o hay error
// nombrado; NUNCA las dos, NUNCA ninguna. Que la exclusión la imponga el wire y
// no una convención es deliberado — un consumidor no puede "olvidarse" de mirar
// el error y quedarse con una salida vacía creyendo que el modelo no dijo nada.
message InferenceResult {
  string command_id = 1; // correlación con el InferenceRequest que lo originó
  oneof result {
    // Sellado X25519 (envelope.SealFor con cloud_enc_pubkey) de un InferenceOutput
    // marshalado. Mismo trato que SensitivePayload en IncomingMessage (ADR-0020
    // §5): la salida del modelo puede contener texto literal del cliente, así que
    // no viaja en claro. En ESTA dirección sí se puede sellar (ver el porqué en
    // InferenceRequest.enc_prompt).
    bytes enc_output = 2;
    // Error nombrado: por qué NO hay salida. Va EN CLARO y FUERA del sobre a
    // propósito — no lleva PII (es un vocabulario cerrado, ver el enum) y el Cloud
    // necesita poder decidir su degradación aunque el sellado sea justamente lo
    // que falló. Un error dentro del sobre sería ilegible exactamente en el caso
    // en que más falta hace leerlo.
    InferenceError error = 3;
  }
}

// InferenceOutput: sub-payload SELLADO del InferenceResult (Plan 044 · Ola 1.6).
// El Edge lo marshala y lo sella (envelope.SealFor) hacia
// InferenceResult.enc_output; el Cloud lo abre (envelope.OpenWith) y lo
// desmarshala. Es el análogo de SensitivePayload y existe por lo mismo: sellar
// exige un mensaje que marshalar, y tenerlo permite añadir mañana campos sellados
// sin tocar el frame de fuera.
message InferenceOutput {
  // El JSON CRUDO tal cual lo devolvió el modelo. El Edge no lo valida, no lo
  // reformatea y no lo trunca: el parseo, el schema, sanitizeParams y el umbral
  // son del caller EN EL CLOUD (ADR-0045 §5). Si el modelo devolvió algo que no es
  // JSON, eso exactamente es lo que debe llegar arriba — un Edge que "arregle" la
  // forma haría invisible el fallo del prompt, que es lo único que se puede
  // corregir.
  string raw_json = 1;
}

// InferenceError: por qué el Edge no pudo servir una inferencia (Plan 044 · Ola
// 1.6, ADR-0045 §2, REQ-34).
//
// ENUM y no string libre a propósito: es un vocabulario CERRADO que el consumidor
// mapea uno a uno a motivos de degradación (T1.6-6 escribe la notificación al
// dueño desde aquí). Con string libre, un valor nuevo —o mal escrito— en el Edge
// se convierte arriba en un motivo desconocido que nadie nota; el enum obliga a
// que ampliar el vocabulario sea un cambio de contrato, visible en los DOS
// extremos. Contraste deliberado con `degraded_reason` de SessionHealth, que sí es
// string: aquello es diagnóstico para que lo lea un humano, esto es la ENTRADA DE
// UNA DECISIÓN.
//
// Aditivo/no-breaking: los valores nuevos van SIEMPRE al final.
enum InferenceError {
  // Sin uso en el cable: cuando no hay error, la rama del oneof es enc_output.
  // Existe porque proto3 exige un cero y buf lo quiere con este nombre.
  INFERENCE_ERROR_UNSPECIFIED = 0;
  INFERENCE_ERROR_OLLAMA_DOWN = 1; // el proveedor local no responde (proceso caído, puerto cerrado, modelo ausente)
  INFERENCE_ERROR_BREAKER_OPEN = 2; // el breaker del Edge está abierto (ADR-0042): se rechaza SIN intentar, jamás colgarse
  INFERENCE_ERROR_TIMEOUT = 3; // se agotó el timeout_ms de ESTA petición
  INFERENCE_ERROR_LEASE_INVALID = 4; // sin lease válido (ADR-0007): servir inferencia es operar, y operar exige lease
  // El semáforo de concurrencia del Edge rechazó la petición: la máquina del
  // cliente está saturada (Plan 044 · T1.6-2). SEPARADO de TIMEOUT a propósito —
  // decirle al dueño "se agotó el tiempo" cuando lo que pasa es que su equipo va
  // corto es MENTIR SOBRE LA CAUSA, y lo manda a mirar la red en vez del hardware.
  INFERENCE_ERROR_EDGE_SIN_CAPACIDAD = 5;
}

// UserLoginRequest: login del operador del Edge contra el IAM de la nube (Plan
// 033 / ADR-0025). Sube por EdgeToCloud; el Edge relaya las credenciales sin
// custodiarlas. El tenant NO viaja aquí: es implícito del canal mTLS. La nube
// responde con un UserAuthResponse correlacionado por command_id (patrón
// ConfigUpdate/Diagnostics: request/response por command_id).
message UserLoginRequest {
  string command_id = 1; // correlación con el UserAuthResponse
  string session_id = 2; // sesión/contexto del Edge (multiplexado); puede ir vacío
  string email = 3;      // credencial del operador (relayada al IAM)
  string password = 4;   // credencial del operador (relayada al IAM; nunca se persiste en el Edge)
}

// UserRefreshRequest: renovación del par de tokens del operador (Plan 033 /
// ADR-0025). El Edge presenta el refresh_token vigente y la nube responde con
// un UserAuthResponse (tokens nuevos o error tipado) por command_id.
message UserRefreshRequest {
  string command_id = 1;    // correlación con el UserAuthResponse
  string session_id = 2;    // sesión/contexto del Edge (multiplexado); puede ir vacío
  string refresh_token = 3; // refresh token a canjear en el IAM
}

// UserLogoutRequest: cierre de sesión del operador (Plan 033 / ADR-0025). La
// nube revoca el refresh_token indicado (o todas las sesiones del usuario si
// all_sessions=true) y responde con un UserAuthResponse por command_id. El
// éxito se modela con la rama tokens vacía (UserTokens sin campos) => ok sin
// credenciales nuevas; un fallo llega por la rama error.
message UserLogoutRequest {
  string command_id = 1;    // correlación con el UserAuthResponse
  string session_id = 2;    // sesión/contexto del Edge (multiplexado); puede ir vacío
  string refresh_token = 3; // refresh token a revocar
  bool all_sessions = 4;    // true = revocar todas las sesiones activas del usuario
}

// UserAuthResponse: respuesta única de autenticación de usuario (Plan 033 /
// ADR-0025). Sirve a UserLoginRequest, UserRefreshRequest y UserLogoutRequest,
// correlacionada por command_id. Baja por CloudToEdge. El oneof result separa
// el caso exitoso (tokens) del error tipado (error). Para un logout exitoso,
// result lleva un UserTokens vacío (ok sin credenciales nuevas).
message UserAuthResponse {
  string command_id = 1; // correlación con el request de auth que lo originó
  string session_id = 2; // eco de la sesión/contexto del request
  oneof result {
    UserTokens tokens = 3; // login/refresh ok (con tokens); logout ok (vacío)
    UserAuthError error = 4; // fallo tipado (ver code)
  }
}

// UserTokens: par de tokens emitido por el IAM (Plan 033 / ADR-0025). Espeja
// domain.AuthResult del IAM (AccessToken/RefreshToken/TokenType/ExpiresAt). En
// un logout exitoso viaja vacío (todos los campos en su cero) para señalar ok
// sin credenciales nuevas.
message UserTokens {
  string access_token = 1;  // JWT de acceso
  string refresh_token = 2; // token de refresco
  string token_type = 3;    // p.ej. "Bearer"
  int64 expires_at = 4;     // epoch de expiración del access_token
}

// UserAuthError: error tipado de autenticación de usuario (Plan 033 /
// ADR-0025). code mapea los errores tipados del IAM (ErrInvalidCredentials,
// ErrUserInactive, ErrRefreshInvalid, ErrInvalidInput, y tenant-cruzado) para
// que el Edge decida sin parsear message (que es texto legible, no contrato).
message UserAuthError {
  string code = 1;    // código estable del error del IAM (contrato)
  string message = 2; // detalle legible para humanos (no es contrato)
}
